services:
  runtime:
    build: .
    image: fahad-ai-office/runtime:0.1.0
    container_name: fahad-office-runtime
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HUB_BIND: ${HUB_BIND:-127.0.0.1}
      HUB_PORT: ${HUB_PORT:-2132}
      HUB_AUTH_ENABLED: ${HUB_AUTH_ENABLED:-false}
      HUB_OWNER_EMAIL: ${HUB_OWNER_EMAIL:-}
      HUB_ENABLED: ${HUB_ENABLED:-true}
    labels:
      - traefik.enable=${HUB_TRAEFIK_ENABLED:-false}
      - traefik.http.routers.fahad-office.entrypoints=websecure
      - traefik.http.routers.fahad-office.rule=Host(`${HUB_PUBLIC_HOST:-fahad-ai-office.srv1964598.hstgr.cloud}`)
      - traefik.http.routers.fahad-office.tls.certresolver=letsencrypt
      - traefik.http.services.fahad-office.loadbalancer.server.port=2132
    ports:
      - "127.0.0.1:2132:2132"
    networks:
      - fahad-office-net
    volumes:
      - ./logs:/app/logs
      - office-workspace:/app/workspace
      - office-claude-home:/app/.claude
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  fahad-office-net:
    name: fahad-office-net
    driver: bridge

volumes:
  office-workspace:
    name: fahad-office-workspace
  office-claude-home:
    name: fahad-office-claude-home
