name: Office deployment transport diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    if: github.ref == 'refs/heads/codex/v3-deploy-network-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Compare endpoint and test transport without credentials or deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket, hashlib, base64
          expected_ip = '187.53.136.113'
          expected_name = 'srv1964598.hstgr.cloud'
          host = os.environ.get('VPS_HOST', '')
          print('configured_host_present=' + str(bool(host)).lower())
          print('configured_host_has_outer_whitespace=' + str(host != host.strip()).lower())
          print('configured_host_matches_expected_literal=' + str(host in (expected_ip, expected_name)).lower())
          def probe(label, target):
              try:
                  ips = {v[4][0] for v in socket.getaddrinfo(target, 22, type=socket.SOCK_STREAM)}
                  print(label + '_dns_resolves=true')
                  print(label + '_resolves_expected_ip=' + str(expected_ip in ips).lower())
                  with socket.create_connection((target,22),timeout=15) as s:
                      s.settimeout(5)
                      banner=s.recv(255)
                      print(label + '_tcp22_open=true')
                      print(label + '_ssh_banner=' + str(banner.startswith(b'SSH-')).lower())
              except Exception as e:
                  print(label + '_transport_error=' + type(e).__name__)
          if host and host.strip() == host and all(c.isalnum() or c in '.-' for c in host):
              probe('configured',host)
          else:
              print('configured_host_valid=false')
          probe('approved_ip', expected_ip)
          probe('approved_dns', expected_name)
          PY
