name: Validate Fahad AI Office

on:
  push:
    branches: [codex/deployment-automation]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test readiness and rollback without live credentials
        run: |
          set -euo pipefail
          find src continuity/src development -name '*.js' -print0 | xargs -0 -n1 node --check
          node --test
          bash -n setup.sh deploy-setup.sh ops/deploy.sh ops/install-deploy.sh
      - name: Build locked runtime image
        run: docker build --tag fahad-office-validation:${{ github.sha }} .
      - name: Build isolated development image
        run: docker build --file development/Dockerfile --tag fahad-office-development:${{ github.sha }} .
      - name: Verify development privilege separation
        run: docker run --rm --entrypoint node fahad-office-development:${{ github.sha }} development/verify-isolation.js
