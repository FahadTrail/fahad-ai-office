<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Fahad AI Office</title>
<link rel="preload" href="./ui/fonts/inter-latin-var.woff2?v=__UI_VERSION__" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./ui/app.css?v=__UI_VERSION__">
</head>
<body>
<div id="login" class="login hidden" role="dialog" aria-labelledby="loginTitle">
  <form id="loginForm" class="login-card" autocomplete="on">
    <div class="brand-mark" aria-hidden="true">F</div>
    <h1 id="loginTitle">Fahad AI Office</h1>
    <p class="muted" id="loginHint">Sign in with a one-time code sent to your email.</p>
    <label class="field-label" for="loginEmail">Email</label>
    <input id="loginEmail" class="input" type="email" autocomplete="email" required>
    <div id="otpRow" class="hidden">
      <label class="field-label" for="loginCode">6-digit code</label>
      <input id="loginCode" class="input" inputmode="numeric" pattern="\d{6}" maxlength="6" autocomplete="one-time-code">
    </div>
    <p id="loginError" class="form-error hidden" role="alert"></p>
    <button id="loginSubmit" class="btn btn-primary btn-block" type="submit">Send code</button>
  </form>
</div>

<div id="app" class="app hidden">
  <aside id="sidebar" class="sidebar" aria-label="Navigation">
    <div class="sidebar-top">
      <a class="brand" href="#/">
        <span class="brand-mark" aria-hidden="true">F</span>
        <span class="brand-name">Fahad AI Office</span>
      </a>
      <button id="sidebarClose" class="icon-btn only-mobile" aria-label="Close menu">✕</button>
    </div>
    <label class="sr-only" for="projectSelect" data-i18n="currentProject">المشروع الحالي</label>
    <select id="projectSelect" class="input input-sm project-select"></select>
    <a href="#/chief" class="btn btn-primary btn-block new-chat" id="newChat" data-i18n="askChief">＋ اسأل CHIEF</a>
    <button type="button" class="search-trigger" id="searchOpen" aria-label="Search the Office (Ctrl K)"><span data-i18n="search">بحث</span><kbd dir="ltr">⌘K</kbd></button>
    <nav class="nav">
      <div class="nav-group" data-i18n="workspace">مساحة العمل</div>
      <a class="nav-item" href="#/" data-nav="home"><span class="nav-ico">⌂</span><span data-i18n="home">الرئيسية</span></a>
      <a class="nav-item" href="#/projects" data-nav="projects"><span class="nav-ico">▣</span><span data-i18n="projects">المشاريع</span></a>
      <a class="nav-item" href="#/employees" data-nav="employees"><span class="nav-ico">☷</span><span data-i18n="team">الفريق</span><span id="workingCount" class="count hidden"></span></a>
      <a class="nav-item" href="#/work" data-nav="work"><span class="nav-ico">✓</span><span data-i18n="work">العمل</span><span id="runningCount" class="count hidden"></span></a>
      <a class="nav-item" href="#/attention" data-nav="attention"><span class="nav-ico">●</span><span data-i18n="approvals">الموافقات</span><span id="attentionCount" class="count count-alert hidden"></span></a>
      <a class="nav-item" href="#/continuity" data-nav="continuity"><span class="nav-ico">↻</span><span data-i18n="continuity">الاستمرارية</span></a>
      <div class="nav-group" data-i18n="platform">المنصة</div>
      <a class="nav-item" href="#/models" data-nav="models"><span class="nav-ico">◎</span><span data-i18n="models">السعة والتكلفة</span></a>
      <a class="nav-item" href="#/artifacts" data-nav="artifacts"><span class="nav-ico">◧</span><span data-i18n="files">الملفات والنتائج</span></a>
      <a class="nav-item" href="#/settings" data-nav="settings"><span class="nav-ico">⚙︎</span><span data-i18n="settings">الإعدادات</span></a>
      <details class="nav-more" id="navMore">
        <summary class="nav-item"><span class="nav-ico">⋯</span><span data-i18n="more">المزيد</span></summary>
        <a class="nav-item" href="#/office" data-nav="office"><span class="nav-ico">◉</span><span data-i18n="liveOffice">المكتب المباشر</span></a>
        <a class="nav-item" href="#/chats" data-nav="chats"><span class="nav-ico">◇</span><span data-i18n="chats">المحادثات</span></a>
        <a class="nav-item" href="#/integrations" data-nav="integrations"><span class="nav-ico">⇄</span><span data-i18n="integrations">الربط</span></a>
      </details>
      <div id="recentChats" class="recent-chats hidden" aria-hidden="true"></div>
    </nav>
  </aside>
  <div id="scrim" class="scrim hidden"></div>
  <main class="main">
    <header class="topbar only-mobile">
      <button id="menuButton" class="icon-btn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">☰</button>
      <span id="topTitle" class="topbar-title">Fahad AI Office</span>
      <a href="#/attention" class="icon-btn attention-dot hidden" id="topAttention" aria-label="Needs attention">●</a>
    </header>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>
<div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
<script src="./ui/app.js?v=__UI_VERSION__" type="module"></script>
</body>
</html>
